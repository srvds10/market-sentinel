# /etc/nginx/sites-available/market-sentinel
# Serves the React frontend on port 80 and proxies /api + /ws to FastAPI on 8000.

server {
    listen 80;
    server_name _;    # replace with your domain or Lightsail static IP

    # React static assets
    root /opt/market-sentinel/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_read_timeout     3600s;   # keep WS alive
    }

    # Health check (used by Lightsail load balancer if configured)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
